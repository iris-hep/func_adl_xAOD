name: Push to PyPI

on:
  release:
    types: [released, prereleased]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatch
      - name: Build the package
        run: |
          # Extract version number from github.ref and write to version.txt
          version=$(echo "${{ github.ref }}" | sed 's/refs\/tags\///')
          echo "__version__=\"$version\"" > func_adl_xAOD/version.txt
          hatch build
      - name: Store distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Must match the separately configured PyPI Trusted Publisher.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Retrieve distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish func_adl_xAOD to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
